name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay-linux:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --locked -p sccr-relay --target "$TARGET"
      - name: package
        run: |
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/sccr-relay-$TARGET.tar.gz" sccr-relay
          (cd dist && sha256sum "sccr-relay-$TARGET.tar.gz" > "sccr-relay-$TARGET.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: sccr-relay-linux
          path: dist/*

  agent-macos:
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p sccr-agent --target "$TARGET"
      - name: package
        run: |
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/sccr-agent-$TARGET.tar.gz" sccr-agent
          (cd dist && shasum -a 256 "sccr-agent-$TARGET.tar.gz" > "sccr-agent-$TARGET.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: sccr-agent-macos
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [relay-linux, agent-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
