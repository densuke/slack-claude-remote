[package]
name = "sccr-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.13.0"
protocol = { version = "0.1.0", path = "../protocol" }
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }
